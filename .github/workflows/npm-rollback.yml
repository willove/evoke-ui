name: npm rollback (temporary)

# 临时工作流：latest 重新定位到 0.2.0（unpublish 需要账号级权限，由人工在 npm 网站执行）

on:
  workflow_dispatch:

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Retag latest to 0.2.0
        run: npm dist-tag add @wil-works/evoke-ui@0.2.0 latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
