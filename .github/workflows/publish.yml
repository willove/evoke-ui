name: Publish to npm

on:
  # 手动触发：可选发布哪个包
  workflow_dispatch:
    inputs:
      package:
        description: "选择要发布的包"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - business-ui
          - ui
          - chat
          - charts

  # 发布 GitHub Release 时自动发布全部包
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - { name: business-ui, pkg: "@wil-works/evoke-business-ui", dir: packages/evoke-business-ui }
          - { name: chat, pkg: "@wil-works/evoke-chat", dir: packages/evoke-chat }
          - { name: ui, pkg: "@wil-works/evoke-ui", dir: packages/evoke-ui }
          - { name: charts, pkg: "@wil-works/evoke-charts", dir: packages/evoke-charts }
      # 手动选择单个包时跳过另一个
      max-parallel: 1
    steps:
      - name: Skip when package not selected
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ inputs.package }}" != "both" ] \
             && [ "${{ inputs.package }}" != "${{ matrix.name }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.gate.outputs.skip == 'false'

      - name: Skip when version already published
        id: published
        if: steps.gate.outputs.skip == 'false'
        run: |
          LOCAL="$(node -p "require('./${{ matrix.dir }}/package.json').version")"
          REMOTE="$(npm view "${{ matrix.pkg }}@$LOCAL" version 2>/dev/null || true)"
          if [ "$REMOTE" = "$LOCAL" ]; then
            echo "::notice::${{ matrix.pkg }}@$LOCAL 已在 npm 上，跳过"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/setup@v1
        if: steps.gate.outputs.skip == 'false' && steps.published.outputs.skip != 'true'
        with:
          version: 11
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        if: steps.gate.outputs.skip == 'false' && steps.published.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      # 带上工作区依赖一起构建（`pkg...`）：全新 checkout 里 peer 包没有 dist，
      # evoke-chat 的类型检查需要底座的 d.ts，只建自己会报 TS2307
      - name: Build
        if: steps.gate.outputs.skip == 'false' && steps.published.outputs.skip != 'true'
        run: pnpm --filter "${{ matrix.pkg }}..." build

      - name: Configure npm auth
        if: steps.gate.outputs.skip == 'false' && steps.published.outputs.skip != 'true'
        run: echo "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}" >> ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish
        if: steps.gate.outputs.skip == 'false' && steps.published.outputs.skip != 'true'
        run: pnpm --filter ${{ matrix.pkg }} publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
