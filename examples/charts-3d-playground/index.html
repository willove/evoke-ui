<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Charts 3D Playground</title>
    <style>
      :root {
        color-scheme: light;
        --pg-bg: #f5f6f8;
        --pg-card: #ffffff;
        --pg-text: #1f2937;
        --pg-text-2: #6b7280;
        --pg-border: rgba(31, 41, 55, 0.1);
      }
      html.dark {
        color-scheme: dark;
        --pg-bg: #111318;
        --pg-card: #1a1d24;
        --pg-text: #e5e7eb;
        --pg-text-2: #9ca3af;
        --pg-border: rgba(229, 231, 235, 0.12);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--pg-bg);
        color: var(--pg-text);
        font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        transition: background 0.3s ease;
      }
      header {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 20px 28px;
      }
      header h1 { font-size: 17px; margin: 0; }
      header p { margin: 0; font-size: 12px; color: var(--pg-text-2); }
      header .spacer { flex: 1; }
      button {
        appearance: none;
        border: 1px solid var(--pg-border);
        background: var(--pg-card);
        color: var(--pg-text);
        font-size: 12px;
        padding: 7px 14px;
        border-radius: 8px;
        cursor: pointer;
      }
      button:hover { border-color: #175dff55; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(480px, 1fr));
        gap: 18px;
        padding: 0 28px 32px;
      }
      .card {
        background: var(--pg-card);
        border: 1px solid var(--pg-border);
        border-radius: 14px;
        padding: 14px 14px 6px;
      }
      .card h2 {
        margin: 2px 4px 10px;
        font-size: 13px;
        font-weight: 600;
        color: var(--pg-text);
      }
      .card h2 span { font-weight: 400; color: var(--pg-text-2); font-size: 11px; margin-left: 8px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
